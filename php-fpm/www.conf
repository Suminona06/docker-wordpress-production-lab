[www]
user = www-data
group = www-data
listen = 9000

; Gunakan dynamic agar hemat RAM saat idle
pm = dynamic

; Maksimal worker process (sesuaikan RAM)
; Rumus kasar: (RAM tersedia untuk PHP / 50MB per process)
; (512MB / 50MB) = ~10 process
pm.max_children = 10

; Jumlah process saat startup
pm.start_servers = 2

; Minimum process saat idle
pm.min_spare_servers = 1

; Maksimum process saat idle
pm.max_spare_servers = 3

; Restart worker setelah handle 500 request (cegah memory leak)
pm.max_requests = 500

; Timeout request PHP
request_terminate_timeout = 300
