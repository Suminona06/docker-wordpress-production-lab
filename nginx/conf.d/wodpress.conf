# ============================================================
# KONFIGURASI HTTP (Sementara — sebelum SSL aktif)
# ============================================================

# Batasi ukuran upload
client_max_body_size 256M;

# Sembunyikan versi Nginx untuk keamanan
server_tokens off;

# ============================================================
# Server Block: HTTP → Redirect ke HTTPS (setelah SSL aktif)
# Untuk sekarang, aktifkan dulu tanpa redirect
# ============================================================
server {
    listen 80;
    listen [::]:80;

    server_name wp.zisstacy.my.id www.wp.zisstacy.my.id;

    root /var/www/html;
    index index.php index.html index.htm;

    # Logging
    access_log /var/log/nginx/wordpress_access.log;
    error_log /var/log/nginx/wordpress_error.log;

    # Aset statis langsung dilayani Nginx (lebih cepat, tanpa lewat PHP)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|pdf|mp4|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Blokir akses ke file sensitif
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* (wp-config\.php|xmlrpc\.php|readme\.html|license\.txt) {
        deny all;
    }

    # WordPress: coba file → direktori → fallback ke index.php
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Teruskan request PHP ke container WordPress (php-fpm)
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # 'wordpress' adalah nama service di docker-compose.yml
        fastcgi_pass wordpress:9000;

        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Timeout yang lebih longgar untuk admin yang berat
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;

        # Buffer optimization
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Halaman status Nginx (untuk monitoring internal)
    location /nginx_status {
        stub_status on;
        allow 127.0.0.1;
        deny all;
    }
}
